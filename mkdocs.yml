site_name: MemoraDB Documentation
site_description: Official technical documentation and user manual for MemoraDB, a custom C++ DBMS with temporal and semantic search capabilities.
site_author: MemoraDB Team
site_url: https://v1haan24.github.io/MemoraDB/

repo_name: v1haan24/MemoraDB
repo_url: https://github.com/v1haan24/MemoraDB

theme:
  name: material
  language: en
  # Branding & Logo configuration (drop your assets in docs/assets/)
  logo: assets/logo.png
  favicon: assets/favicon.ico
  palette:
    # Primary MemoraDB Theme (Dark Terminal Identity)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light Mode (Secondary / Accessibility Option)
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3

copyright: "MemoraDB"

extra:
  generator: false

