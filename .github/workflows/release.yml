name: "Unified CI/CD: Tests, Docs & Standalone Installers"

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  # ============================================================
  # 1. TESTS: Run CTest test suite
  # ============================================================
  run-tests:
    name: Run CTest Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure CMake with Tests
        run: |
          cmake -B build-tests -G "Ninja" -DCMAKE_BUILD_TYPE=Release -DMEMORA_BUILD_TESTS=ON

      - name: Build Test Suite
        run: |
          cmake --build build-tests --config Release

      - name: Run CTest
        run: |
          ctest --test-dir build-tests --output-on-failure

  # ============================================================
  # 2. DOCS: Build and Deploy MkDocs to GitHub Pages
  # ============================================================
  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install MkDocs Material
        run: |
          pip install mkdocs-material

      - name: Deploy Docs to gh-pages
        run: |
          mkdocs gh-deploy --force

  # ============================================================
  # 3. WINDOWS: Build Setup EXE (MinGW + DLLs + Models + Inno)
  # ============================================================
  build-windows:
    name: Windows Setup (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup, Ninja, and MinGW
        shell: powershell
        run: |
          choco install innosetup ninja mingw -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH
          echo "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH

      - name: Configure CMake (MinGW Release)
        shell: bash
        run: |
          cmake -B build -G "Ninja" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++

      - name: Build MemoraDB and stage runtime assets
        shell: bash
        run: |
          cmake --build build --config Release

      - name: Build Inno Setup Installer (.exe)
        shell: cmd
        run: |
          iscc installer.iss

      - name: Rename Setup Executable
        shell: bash
        run: |
          mv MemoraDB-Setup-v*.exe MemoraDB-Setup-Windows-x64.exe

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: MemoraDB-Setup-Windows-x64.exe

  # ============================================================
  # 4. MACOS: Build Standalone DMG & ZIP with MemoraDB.app
  # ============================================================
  build-macos:
    name: macOS Installer (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Configure and Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package macOS DMG & ZIP
        run: |
          chmod +x package_mac.sh
          ./package_mac.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            MemoraDB-Setup-macOS.dmg
            MemoraDB-macOS.zip

  # ============================================================
  # 5. LINUX: Build Standalone AppImage (Ubuntu 20.04 Baseline)
  # ============================================================
  build-linux:
    name: Linux Package (.AppImage)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - name: Install Build Tools (Ubuntu 20.04 Baseline)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build libfuse2 file wget curl git tar gzip ca-certificates
          wget -qO- https://github.com/Kitware/CMake/releases/download/v3.28.3/cmake-3.28.3-linux-x86_64.tar.gz | tar -xz -C /usr/local --strip-components=1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and Build
        run: |
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package Linux AppImage & Tarball
        run: |
          chmod +x package_linux.sh
          ./package_linux.sh

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            MemoraDB-Setup-Linux-x86_64.AppImage
            MemoraDB-Linux-x86_64.tar.gz

  # ============================================================
  # 6. RELEASE: Publish all packages to GitHub Releases
  # ============================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Organize release files
        run: |
          mkdir -p release-files
          find dist-artifacts -type f -exec cp {} release-files/ \;
          echo "=== Release Assets Ready for Publishing ==="
          ls -lh release-files/

      - name: Determine Tag
        id: tag_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "release_tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=${{ github.event.inputs.version || 'v1.0.0' }}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.release_tag }}
          name: "MemoraDB Release ${{ steps.tag_info.outputs.release_tag }}"
          body: |
            ## 🚀 MemoraDB Standalone Packages & Installers

            Official standalone distribution packages for **MemoraDB**.
            These bundles include all required runtime libraries (MinGW DLLs, ONNX Runtime, and MiniLM embedding models) and run out-of-the-box without needing any external compilers, GCC, or Python!

            ### 📦 Platform Downloads:
            - **Windows (x64)**: `MemoraDB-Setup-Windows-x64.exe` (Complete Inno Setup Installer)
            - **macOS (Universal)**: `MemoraDB-Setup-macOS.dmg` (Apple Disk Image containing `MemoraDB.app`) or `MemoraDB-macOS.zip`
            - **Linux (x86_64)**: `MemoraDB-Setup-Linux-x86_64.AppImage` (Universal AppImage with GLIBC 2.31 baseline) or `MemoraDB-Linux-x86_64.tar.gz` (Portable server archive)
          files: release-files/*
          draft: false
          prerelease: false
